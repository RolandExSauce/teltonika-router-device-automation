# nginx.conf

# Events block
events {}

# HTTP block
http {
    # Define MIME types if needed for Material UI or other files
    include       mime.types;
    default_type  application/octet-stream;

    # Define server block for HTTPS
    server {
        # Listen on port 443 for HTTPS
        listen 443 ssl;

        # Server name (hostname)
        server_name webtonik.client;

        # SSL configurations
        ssl_certificate /etc/nginx/cert/client.crt;
        ssl_certificate_key /etc/nginx/cert/client.key;
     
        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer-when-downgrade;
        add_header X-XSS-Protection "1; mode=block";
        
        # Access logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

    
        # Route all other requests to index.html for client-side routing
        location / {
            root /usr/share/nginx/html/;
            try_files $uri $uri/ /index.html;
        }

        # forward request 
        location /webTonikApi {
           proxy_pass   https://webtonik.server:4000;
        }

    }
}
